# Netlify 設定ファイル — 株式会社TEZU Intelligence HP

[build]
  # 公開フォルダはビルド時に dist/ を生成(許可リスト方式)。内部ファイルは公開されない。
  command = "sh scripts/build-public.sh"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

# /api/* → Netlifyサーバーレス関数にルーティング
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
